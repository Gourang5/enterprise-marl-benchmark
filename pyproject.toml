[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-marl-env"
version = "1.2.0"
description = "Database-first multi-agent enterprise RL benchmark"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rl = [
    "numpy>=1.26",
    "gymnasium>=1.0",
    "pettingzoo>=1.25",
]

dev = [
    "pytest>=8.0",
]

ui = [
    "streamlit>=1.36",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]